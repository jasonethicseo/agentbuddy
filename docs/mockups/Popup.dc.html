<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AgentBuddy ding popups</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&amp;family=Silkscreen&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D5FB8}a:hover{color:#123F7D}
</style>
</helmet>
<div style="width: 340px; height: 320px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; background: #E6ECF3; font-family: 'Nanum Gothic', sans-serif; font-size: 12px; color: #1B2433">
<div style="width: 300px; align-self: flex-end; border: 2px solid #1D5FB8; border-radius: 8px 8px 3px 3px; background: #FFFFFF; overflow: hidden">
<div style="display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 8px; background: linear-gradient(180deg, #4A9BEA 0%, #1D5FB8 100%); color: #FFFFFF">
<span style="font-family: Silkscreen, monospace; font-size: 11px; flex-grow: 1">Ding! ♪ new message</span>
<span style="font-size: 10px">14:23 · newest</span>
<button type="button" aria-label="Close message" style="width: 18px; height: 18px; border: 1px solid #BFD9F5; border-radius: 3px; background: #2F78D0; color: #FFFFFF; font-size: 10px; padding: 0">×</button>
</div>
<div style="display: flex; gap: 10px; padding: 10px 10px 8px">
<svg width="28" height="28" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="#2F6FDE"/><path d="M4 7.2 L6.2 9.3 L10 5" stroke="#FFFFFF" stroke-width="1.8" fill="none"/></svg>
<div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1">
<span style="font-weight: 800">Codex <span style="color: #4E5B6E; font-weight: 400">@ agentbuddy</span></span>
<span style="color: #1D4FA8; font-weight: 700">★ done~ your turn!</span>
<span style="color: #4E5B6E">Created hello.txt.</span>
</div>
</div>
<div style="display: flex; justify-content: flex-end; gap: 6px; padding: 0 10px 10px">
<button type="button" style="height: 26px; padding: 0 10px; border: 1px solid #A9C6E8; border-radius: 4px; background: #F4F8FD; color: #33465F; font-family: inherit; font-size: 12px">Later</button>
<button type="button" style="height: 26px; padding: 0 12px; border: 1px solid #123F7D; border-radius: 4px; background: #1D5FB8; color: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 700">Go there →</button>
</div>
</div>
<div style="width: 300px; align-self: flex-end; border: 2px solid #D9541E; border-radius: 8px 8px 3px 3px; background: #FFFFFF; overflow: hidden; box-shadow: 0 2px 0 #B8461A">
<div style="display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 8px; background: linear-gradient(180deg, #F59A4E 0%, #D9541E 100%); color: #FFFFFF">
<span style="font-family: Silkscreen, monospace; font-size: 11px; flex-grow: 1">Ding! ♪ needs your OK</span>
<span style="font-size: 10px">14:21</span>
<button type="button" aria-label="Close message" style="width: 18px; height: 18px; border: 1px solid #FFD2B8; border-radius: 3px; background: #C2471A; color: #FFFFFF; font-size: 10px; padding: 0">×</button>
</div>
<div style="display: flex; gap: 10px; padding: 10px 10px 8px">
<svg width="28" height="28" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="#D9541E"/><text x="7" y="10.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">!</text></svg>
<div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1">
<span style="font-weight: 800">Claude Code <span style="color: #4E5B6E; font-weight: 400">@ agentbuddy</span></span>
<span style="color: #8A3C00; font-weight: 700">need your OK T_T</span>
<span style="color: #4E5B6E">session · fix login</span>
</div>
</div>
<div style="display: flex; justify-content: flex-end; gap: 6px; padding: 0 10px 10px">
<button type="button" style="height: 26px; padding: 0 10px; border: 1px solid #F3C99B; border-radius: 4px; background: #FFF8F1; color: #6B3000; font-family: inherit; font-size: 12px">Later</button>
<button type="button" style="height: 26px; padding: 0 12px; border: 1px solid #8A3C00; border-radius: 4px; background: #C2471A; color: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 700">Go there →</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":340,"height":320}}'>

return {};

</body>
</html>
