<head>

</head>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&amp;family=Silkscreen&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D5FB8}a:hover{color:#123F7D}
</style>
</helmet>
<div style="width: 320px; height: 620px; box-sizing: border-box; display: flex; flex-direction: column; font-family: 'Nanum Gothic', sans-serif; font-size: 12px; color: #1B2433; background: #F4F8FD; border: 3px solid #1D5FB8; border-radius: 10px 10px 4px 4px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: linear-gradient(180deg, #4A9BEA 0%, #1D5FB8 100%); color: #FFFFFF">
<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2" width="14" height="10" fill="#FFFFFF"/><rect x="3" y="12" width="3" height="3" fill="#FFFFFF"/><rect x="5" y="6" width="2" height="2" fill="#1D5FB8"/><rect x="9" y="6" width="2" height="2" fill="#1D5FB8"/></svg>
<span style="font-family: Silkscreen, monospace; font-size: 13px; flex-grow: 1">AgentBuddy</span>
<button type="button" aria-label="Minimize" style="width: 22px; height: 20px; border: 1px solid #BFD9F5; border-radius: 3px; background: #2F78D0; color: #FFFFFF; font-size: 11px; padding: 0">_</button>
<button type="button" aria-label="Close to menu bar" style="width: 22px; height: 20px; border: 1px solid #FFD2B8; border-radius: 3px; background: #D9541E; color: #FFFFFF; font-size: 11px; padding: 0">×</button>
</div>
<div style="display: flex; padding: 6px 8px 0; gap: 4px; background: #DDE9F7; border-bottom: 1px solid #A9C6E8">
<button type="button" style="padding: 6px 12px; border: 1px solid transparent; border-radius: 6px 6px 0 0; background: transparent; color: #33465F; font-family: inherit; font-size: 12px">Buddies</button>
<button type="button" style="padding: 6px 12px; border: 1px solid transparent; border-radius: 6px 6px 0 0; background: transparent; color: #33465F; font-family: inherit; font-size: 12px">Inbox</button>
<button type="button" style="padding: 6px 12px; border: 1px solid #A9C6E8; border-bottom: 0; border-radius: 6px 6px 0 0; background: #F4F8FD; color: #1B2433; font-family: inherit; font-size: 12px; font-weight: 800">Settings</button>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 12px 10px">
<div style="display: flex; flex-direction: column; border: 1px solid #C9DBF0; border-radius: 6px; background: #FFFFFF">
<span style="padding: 8px 10px 4px; font-weight: 800; color: #1B3A66">Window</span>
<label style="display: flex; align-items: center; gap: 8px; padding: 8px 10px"><span style="flex-grow: 1">Always on top</span><input type="checkbox" checked style="width: 16px; height: 16px; accent-color: #1D5FB8"></label>
</div>
<div style="display: flex; flex-direction: column; border: 1px solid #C9DBF0; border-radius: 6px; background: #FFFFFF">
<span style="padding: 8px 10px 4px; font-weight: 800; color: #1B3A66">When an agent needs you</span>
<label style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #EEF3F9"><span style="flex-grow: 1">Ding! sound</span><input type="checkbox" checked style="width: 16px; height: 16px; accent-color: #1D5FB8"></label>
<label style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #EEF3F9"><span style="flex-grow: 1">Message popup</span><input type="checkbox" checked style="width: 16px; height: 16px; accent-color: #1D5FB8"></label>
<label style="display: flex; align-items: center; gap: 8px; padding: 8px 10px"><span style="flex-grow: 1">macOS notification too</span><input type="checkbox" style="width: 16px; height: 16px; accent-color: #1D5FB8"></label>
</div>
<div style="display: flex; flex-direction: column; border: 1px solid #C9DBF0; border-radius: 6px; background: #FFFFFF">
<span style="padding: 8px 10px 4px; font-weight: 800; color: #1B3A66">Privacy</span>
<label style="display: flex; align-items: center; gap: 8px; padding: 8px 10px"><span style="flex-grow: 1">Hide prompt and reply text</span><input type="checkbox" style="width: 16px; height: 16px; accent-color: #1D5FB8"></label>
<span style="padding: 0 10px 8px; color: #4E5B6E; font-size: 11px">Everything stays on this computer.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; border: 1px solid #C9DBF0; border-radius: 6px; background: #FFFFFF; padding: 8px 10px">
<span style="font-weight: 800; color: #1B3A66">Connections</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #2E9E4F"></span>Relay · 127.0.0.1:4343</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #2E9E4F"></span>Kiro · hooks on</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #2E9E4F"></span>Claude Code · hooks on</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #B8860B"></span>Codex · finished turns only</span>
</div>
</div>
</div>
