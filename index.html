<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentBuddy</title>
  </head>
  <body>
    <div class="window">
      <header class="titlebar">
        <span class="tb-sprite" aria-hidden="true"></span>
        <span class="app-title">AgentBuddy<span class="title-mark" aria-hidden="true"></span></span>
        <button type="button" class="tb-btn tb-pin" aria-label="Pin on top" aria-pressed="true">▲</button>
        <button type="button" class="tb-btn tb-min" aria-label="Minimize">_</button>
        <button type="button" class="tb-btn tb-close" aria-label="Close to menu bar">×</button>
      </header>
      <div class="me-row" hidden></div>
      <div class="alert-strip" role="status" hidden></div>
      <nav class="tabs" role="tablist" aria-label="Screens">
        <button type="button" class="tab" role="tab" data-tab="list" aria-selected="true">Buddies</button>
        <button type="button" class="tab" role="tab" data-tab="inbox" aria-selected="false">Inbox</button>
        <button type="button" class="tab" role="tab" data-tab="settings" aria-selected="false">Settings</button>
      </nav>
      <main class="screen screen-list" role="tabpanel" aria-label="Buddies"></main>
      <section class="screen screen-inbox" role="tabpanel" aria-label="Inbox" hidden></section>
      <section class="screen screen-settings" role="tabpanel" aria-label="Settings" hidden></section>
      <footer class="statusbar"></footer>
    </div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
